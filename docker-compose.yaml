services:
  postgres:
    image: debezium/postgres:16-alpine
    container_name: ai_assistant_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:${POSTGRES_PORT:-5432}"
    volumes:
      - ./db/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-xuancong}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-xuancong}
      - POSTGRES_DB=${POSTGRES_DB:-ai-assistant}

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API + Web Dashboard
      - "6334:6334"   # gRPC API
    volumes:
      - ./Ai/qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}

  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice_documentserver
    restart: unless-stopped
    ports:
      - "8083:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=onlyoffice_jwt_secret_key_2026_assistant
      - JWT_HEADER=Authorization
      - JWT_IN_BODY=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
